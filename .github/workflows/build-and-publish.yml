name: Build & publish

# Modelled on privacyshield's build-and-publish.yml. Publishes every image
# this repo produces to GHCR — the backend/CLI, the agent-service (MCP
# Bridge), the playground, and the openapi-docs apps — so a production
# deployment can run entirely from pulled images with zero local builds.
# Auth uses the workflow's built-in GITHUB_TOKEN via the
# `packages: write` permission — no repository secrets required.
#
# Only images whose inputs changed are built (and, off pull requests,
# pushed): the `detect` job runs scripts/detect-changed-images.sh, which
# owns the image -> path mapping. Tag pushes, manual runs, and changes to
# this workflow build everything. Unchanged images keep their previous
# `latest`, so a stale image can only happen if the path table in that
# script is wrong — edit it whenever an image's build inputs change.
#
# NOTE: each package is created PRIVATE on its first-ever publish. Making
# it public is a one-time manual step per package (GitHub → Packages →
# <package> → Package settings → Change visibility) — there is no API
# for it. agent-job-matcher has already been flipped; the three
# sub-images need the same treatment after their first publish.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    # Bot commits that can't change the image (graph refreshes, spec/docs
    # edits) shouldn't burn a build.
    paths-ignore:
      - "graph*.json"
      - "graph.html"
      - "GRAPH_REPORT.md"
      - "graph-manifest.json"
      - "openspec/**"
      - "**/*.md"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout (full history, so any base commit resolves)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect images that need building
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # An empty range makes the script build everything (tags, manual runs).
          RANGE=""
          if [[ "$REF" != refs/tags/* ]]; then
            if [[ "$EVENT" == "pull_request" ]]; then
              RANGE="${PR_BASE}...${PR_HEAD}"
            elif [[ "$EVENT" == "push" ]]; then
              RANGE="${PUSH_BEFORE}..${SHA}"
            fi
          fi
          MATRIX="$(bash scripts/detect-changed-images.sh "$RANGE")"
          echo "range='${RANGE}' matrix=${MATRIX}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          {
            echo "### Images to build"
            if [[ "$MATRIX" == "[]" ]]; then
              echo "None — no image inputs changed in \`${RANGE}\`."
            else
              echo "$MATRIX" | python3 -c "import sys,json; [print('- ' + e['image']) for e in json.load(sys.stdin)]"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # amd64-only: keeps CI fast. amd64 images run fine on Apple Silicon
      # under Docker Desktop's emulation; arm64-native users can build
      # locally with `docker build .`
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
